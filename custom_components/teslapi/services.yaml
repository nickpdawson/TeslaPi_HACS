.target_fields: &target_fields
  config_entry_id:
    required: false
    selector:
      config_entry:
        integration: teslapi
  device_id:
    required: false
    selector:
      device:
        filter:
          integration: teslapi

start_archive:
  fields:
    <<: *target_fields
    trigger:
      required: false
      default: "ha"
      example: "ha"
      selector:
        select:
          options:
            - "ha"
            - "manual"
    delete_after:
      required: false
      default: false
      selector:
        boolean:

cancel_archive:
  fields:
    <<: *target_fields

start_music_sync:
  fields:
    <<: *target_fields
    mode:
      required: false
      default: "full"
      example: "full"
      selector:
        select:
          options:
            - "full"
            - "selected"
            - "random"
            - "recent"
    paths:
      required: false
      example: "/Amy Winehouse"
      selector:
        text:
          multiple: true
    count:
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 100
          mode: box
    type:
      required: false
      default: "artist"
      selector:
        select:
          options:
            - "artist"
            - "album"

cancel_music_sync:
  fields:
    <<: *target_fields
